.stage{position:relative;display:flex;justify-content:center;padding:14px 0 18px;min-height:270px}
#btn{width:min(55vw,240px);aspect-ratio:1;border-radius:50%;border:0;font-size:clamp(70px,18vw,100px);line-height:1;background:radial-gradient(circle at 35% 30%,#ffe08a,var(--ac) 55%,var(--ac2));box-shadow:0 10px 0 var(--ac2),0 18px 30px rgba(0,0,0,.4);touch-action:manipulation}

.me{color:var(--ac);font-weight:800}

#mbtn{width:min(58vw,250px);aspect-ratio:1;border-radius:50%;border:0;font-size:90px;line-height:1;background:radial-gradient(circle at 35% 30%,#ffe08a,var(--ac) 55%,var(--ac2));box-shadow:0 10px 0 var(--ac2);touch-action:manipulation}

.lane{background:var(--card);border:1px solid var(--line);border-radius:99px;height:34px;position:relative;overflow:hidden}

.lane.op i{background:var(--bad)}
.lane span{position:relative;z-index:1;display:block;line-height:34px;font-weight:800;font-size:14px;padding:0 12px;text-align:left;color:#111}
.rnd{display:block;width:100%;margin:6px 0 10px;padding:16px;border:0;border-radius:10px;background:#FFC107;color:#111;font:inherit;font-weight:900;font-size:18px;letter-spacing:1px;box-shadow:0 5px 0 #c79100;touch-action:manipulation}

.stage{min-height:360px;align-items:center;isolation:isolate;overflow:hidden;border-radius:24px;background:radial-gradient(ellipse at 50% 45%,#273a58 0%,#141b2b 48%,#10131c 100%);border:1px solid #46536b;box-shadow:inset 0 0 55px #0009,0 18px 45px #0007;perspective:1000px}

function initFB(){
 if(!window.firebase||FIREBASE_CONFIG.apiKey=="BURAYA")return;
 try{
  if(!firebase.apps.length)firebase.initializeApp(FIREBASE_CONFIG);
  db=firebase.firestore();db.settings({experimentalForceLongPolling:true});
  firebase.auth().onAuthStateChanged(function(user){
   if(user&&user.isAnonymous){
    var guestUid=user.uid;
    Promise.all([db.doc("players/"+guestUid).delete().catch(function(){}),db.doc("saves/"+guestUid).delete().catch(function(){})]).then(function(){
     return user.delete().catch(function(){return firebase.auth().signOut()});
    }).then(function(){UID=null;fbStartedUid=null;cloudReady=false;show()});
    return;
   }
   if(user){
    if(fbStartedUid===user.uid)return;
    UID=user.uid;fbStartedUid=user.uid;cloudReady=false;lastSent=S.total;startFB();
   }else{UID=null;fbStartedUid=null;cloudReady=false;show()}

 leaderboardUn=db.collection("players").orderBy("total","desc").limit(50).onSnapshot(function(s){
  players=s.docs.map(function(x){var v=x.data();v.id=x.id;v.total=Number(v.total)||0;return v});
  players.sort(function(a,b){return b.total-a.total});
  leaderboardStatus="ready";refresh("social");
 },function(err){
  console.warn("Leaderboard ordered query failed; using compatibility query",err);
  if(leaderboardUn){leaderboardUn();leaderboardUn=null}
  leaderboardStatus="fallback";
  leaderboardUn=db.collection("players").limit(150).onSnapshot(function(s){
   players=s.docs.map(function(x){var v=x.data();v.id=x.id;v.total=Number(v.total)||0;return v});
   players.sort(function(a,b){return b.total-a.total});
   players=players.slice(0,50);leaderboardStatus="ready";refresh("social");

  });
 });

function processTeamGroups(out){

 });
}

 if(c.indexOf("operation-not-allowed")>=0)return "Firebase'de E-posta/Şifre girişi açılmamış.";

function renderMatch(){
 if(!match||!match.d||!match.en)return;
 var d=match.d,t=Date.now(),mine=d.ta.indexOf(UID)>=0,my=mine?d.ta:d.tb,op=mine?d.tb:d.ta;
 var tm=document.getElementById("mtimer"),rs=document.getElementById("mres"),a=msum(my),b=msum(op),mx=Math.max(100,a,b),teamMode=Number(d.mode)>1;
 document.getElementById("msa").textContent=(teamMode?"Bizim takım: ":"Sen: ")+a;document.getElementById("msb").textContent=(teamMode?"Rakip takım: ":((d.names&&d.names[op[0]])||"Rakip")+": ")+b;
 document.getElementById("lme").style.width=Math.min(100,a/mx*100)+"%";document.getElementById("lop").style.width=Math.min(100,b/mx*100)+"%";
 renderTeamButtons();
 if(t<match.st){tm.textContent=Math.ceil((match.st-t)/1000);rs.textContent="Hazır ol!";return}
 if(t<match.en){tm.textContent=Math.ceil((match.en-t)/1000)+" sn";rs.textContent="Sadece kendi takımındaki butonuna bas!";return}
 tm.textContent="Bitti";if(!match.fin){match.fin=1;pushClicks(1)}
 var all=my.concat(op).every(function(u){return u==UID||match.dn[u]});
 if(!all&&t<match.en+8000){rs.textContent="Sonuç bekleniyor…";return}
 if(a>b&&!S.claimed[match.id]){S.claimed[match.id]=1;match.rw=duelReward();draw()}
 rs.textContent=(a>b?"🏆 Kazandın!"+(match.rw?" +"+match.rw+" 🔴":""):a<b?"Kaybettin":"Berabere")+" ("+a+" - "+b+")";
 document.getElementById("mclose").style.display="";doneM[match.id]=1;
}
function pushClicks(fin){

 var o={mid:match.id,mc:mClicks};if(fin===1)o.md=true;
 db.doc("players/"+UID).set(o,{merge:true}).catch(function(){});
}
function openMatch(id){
 if(match||doneM[id])return;
 match={id:id,d:null,s:{},dn:{},st:0,en:0,fin:0};mClicks=0;mSent=0;buildOverlay();
 db.doc("matches/"+id).get().then(function(s){
  if(!match||match.id!=id)return;
  if(!s.exists||Date.now()-(s.data().created||0)>6e5){closeMatch(1);return}
  match.d=s.data();
  match.st=Number(match.d.startAt)||((Number(match.d.created)||Date.now())+7000);
  match.en=Number(match.d.endAt)||(match.st+30000);
  db.doc("players/"+UID).set({mid:id,mc:0,md:false},{merge:true}).catch(function(e){console.error("Duel player state write failed",e);toast("Maç verisi gönderilemedi: "+((e&&e.code)||"izin hatası"))});
  renderMatch();
 }).catch(function(){toast("Maç yüklenemedi");closeMatch(1)});
 unMt=db.collection("players").where("mid","==",id).onSnapshot(function(q){
  if(!match||match.id!=id)return;match.s={};match.dn={};
  q.docs.forEach(function(x){var v=x.data();match.s[x.id]=v.mc||0;match.dn[x.id]=!!v.md});
  renderMatch();
 },function(){});
}
function closeMatch(q){

 if(unMt)unMt();unMt=null;match=null;

}
