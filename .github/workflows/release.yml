name: Build and publish Button Wars installers

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "app/**"
      - "main.js"
      - "package.json"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build signed Android APK
        run: gradle assembleDebug --no-daemon
      - name: Prepare APK
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ButtonWars-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-installer
          path: release-assets/ButtonWars-Android.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install
      - name: Build Windows installer
        run: npm run build:win
      - name: Prepare installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          $installer = Get-ChildItem dist -Filter "*.exe" | Where-Object { $_.Name -like "*Setup*" } | Select-Object -First 1
          if (-not $installer) { throw "Windows setup EXE not found in dist" }
          Copy-Item $installer.FullName "release-assets/ButtonWars-Windows-Setup.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: release-assets/ButtonWars-Windows-Setup.exe

  publish:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Publish GitHub release for installed apps
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.13
          name: Button Wars 1.0.13
          target_commitish: main
          generate_release_notes: true
          files: |
            release-assets/android-installer/ButtonWars-Android.apk
            release-assets/windows-installer/ButtonWars-Windows-Setup.exe
